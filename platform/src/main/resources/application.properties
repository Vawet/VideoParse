server.port=${PLATFORM_PORT:9090}
server.address=${PLATFORM_BIND:127.0.0.1}
spring.datasource.url=${JDBC_URL:jdbc:mysql://127.0.0.1:3306/videoparse?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:videoparse}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.table=vp_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.threads.virtual.enabled=true
mybatis-plus.configuration.map-underscore-to-camel-case=true
videoparse.data=${DATA_ROOT:../后端/app}
videoparse.python=${WORKER_PYTHON:python3}
videoparse.worker-dir=${WORKER_DIR:../后端}
videoparse.public-base=${PUBLIC_BASE_URL:http://localhost:5000}
spring.mvc.async.request-timeout=0
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
vp.mq.enabled=${ROCKETMQ_ENABLED:false}
spring.task.scheduling.pool.size=4
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB
