name: videoparse
x-media-env: &media-env
  DATA_ROOT: /data
  PUBLIC_BASE_URL: /api
  DATABASE_URL: mysql+pymysql://videoparse:${DB_PASSWORD:?generate deployment env}@db/videoparse?charset=utf8mb4
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  UPLOAD_ANSWER: ${UPLOAD_ANSWER:?set upload passphrase}

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: videoparse
      MYSQL_USER: videoparse
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 4s
      retries: 40
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes: [cache:/data]
  objects:
    build:
      context: .
      dockerfile: Minio.Dockerfile
      additional_contexts:
        minio_src: https://github.com/minio/minio.git#07c3a429bfed433e49018cb0f78a52145d4bedeb
    command: server /data
    environment:
      MINIO_ROOT_USER: videoparse
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?}
    volumes: [objects:/data]
  qdrant:
    image: qdrant/qdrant:v1.18.2
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?}
    volumes: [vectors:/qdrant/storage]
  namesrv:
    image: apache/rocketmq:5.3.4
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: -Xms128m -Xmx256m -Xmn64m
  broker:
    image: apache/rocketmq:5.3.4
    depends_on: [namesrv]
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx384m -Xmn96m
    command:
      - sh
      - -ec
      - |
        echo "brokerIP1=$$(hostname -i | cut -d' ' -f1)" > /tmp/vp-broker.conf
        echo 'flushDiskType=SYNC_FLUSH' >> /tmp/vp-broker.conf
        exec sh mqbroker -n namesrv:9876 -c /tmp/vp-broker.conf
    volumes: [messages:/home/rocketmq/store]
  platform:
    build:
      context: ../../后端
      target: platform
      additional_contexts:
        platform_src: ../../platform
    environment:
      <<: *media-env
      PLATFORM_BIND: 0.0.0.0
      JDBC_URL: jdbc:mysql://db/videoparse?allowPublicKeyRetrieval=true&connectionTimeZone=UTC
      DB_PASSWORD: ${DB_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      MINIO_ENDPOINT: http://objects:9000
      MINIO_ACCESS_KEY: videoparse
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      PLATFORM_EMBED_MODEL: ${PLATFORM_EMBED_MODEL:-BAAI/bge-m3}
      PLATFORM_AI_KEY: ${PLATFORM_AI_KEY:-}
      PLATFORM_AI_URL: ${PLATFORM_AI_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      PLATFORM_AI_MODEL: ${PLATFORM_AI_MODEL:-qwen-plus}
      PLATFORM_INTERNAL_URL: http://127.0.0.1:9090
      SERVER_FORWARD_HEADERS_STRATEGY: native
      PARSE_ENGINE: ${PARSE_ENGINE:-java}
      WORKER_DIR: /srv
      ROCKETMQ_ENABLED: "true"
      ROCKETMQ_NAMESERVER: namesrv:9876
      WORKER_POLL_MS: 30000
    volumes: [work:/data, models:/root/.cache]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      objects: {condition: service_started}
  web:
    build:
      context: ../..
      dockerfile: infra/platform/Web.Dockerfile
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:80"]
    depends_on: [platform]
volumes:
  db:
  cache:
  objects:
  work:
  models:
  messages:
  vectors:
