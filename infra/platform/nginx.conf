server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 105m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1800s;
    location ~ ^/api/(v2/|tasks/|analyze$|analyze/start$|result/|health$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://platform:9090;
        proxy_buffering off;
    }
    location /api/ {
        proxy_pass http://learning:5000/;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
